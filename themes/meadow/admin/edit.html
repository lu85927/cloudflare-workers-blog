<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>编辑文章 · 老壮'blog后台</title>
    <link rel="icon" type="image/svg+xml" href="https://img.lblog.cc/blog/logo/favicon.svg" />
	<link rel="shortcut icon" type="image/png" href="https://img.lblog.cc/blog/logo/favicon.png"/>
    <link rel="stylesheet" href="https://cdn.staticfile.org/twitter-bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.11.3/dist/index.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lu85927/cloudflare-workers-blog@master/themes/meadow/static/css/admin.css?v=1.0">

    <script src="https://cdn.staticfile.org/jquery/2.2.4/jquery.min.js"></script>
    <script src="https://cdn.staticfile.org/twitter-bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/i18n/defaults-zh_CN.min.js"></script>
	<script>
	(function(){
		var s=localStorage.getItem('meadow-admin-theme');
		if(s==='dark')document.documentElement.setAttribute('data-theme','dark');
	})();
	</script>
</head>
<body>

<div class="ag-app">

	<!-- ======= Sidebar ======= -->
	<aside class="ag-sidebar">
		<div class="ag-brand">
			<div class="ag-brand-logo">
				<img src="https://img.lblog.cc/blog/logo/avatar-square.png" alt="站点头像">
			</div>
			<div class="ag-brand-txt"><strong>老壮'blog</strong><span>Meadow · 田园牧歌</span></div>
		</div>
		<div class="ag-nav-label">控制台</div>
		<ul class="ag-nav">
			<li><a href="/admin/"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回文章列表</a></li>
			<li><a href="/"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>返回首页</a></li>
		</ul>
		<div class="ag-side-foot">
			<a href="/" target="_blank"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>查看站点</a>
		</div>
	</aside>

	<!-- ======= Main ======= -->
	<div class="ag-main">
		<header class="ag-topbar">
			<div class="ag-crumb">
				<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
				<span>管理后台 / <b id="agEditCrumb">编辑文章</b></span>
			</div>
			<div class="ag-tools">
				<button class="ag-icon-btn" id="agThemeBtn" title="切换深浅色" aria-label="切换深浅色">
					<svg class="ag-theme-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
					<svg class="ag-theme-icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
				</button>
				<a href="/" target="_blank" class="ag-site-link"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg><span>访问站点</span></a>
			</div>
		</header>

		<div class="ag-content">
			<div class="ag-page-head">
				<div><h2>编辑文章</h2><p id="agEditSub">修改文章内容与设置，保存后记得发布</p></div>
			</div>
			<div class="ag-card">
				<form id="editForm" class="ag-form" action="/">
					<div class="ag-grid">
						<div class="form-group ag-full">
							<input type="hidden" name="id" id="id" readonly required="true">
							<label>标题</label>
							<input type="text" class="form-control" name="title" id="title" placeholder="文章标题" required="true">
						</div>
						<div class="form-group">
							<label>特色图片</label>
							<input type="url" class="form-control" name="img" id="img" placeholder="https://…（可选）">
						</div>
						<div class="form-group">
							<label>永久链接</label>
							<input type="text" class="form-control" name="link" id="link" placeholder="URL 路径" required="true">
						</div>
						<div class="form-group">
							<label>创建日期</label>
							<input type="datetime-local" class="form-control" id="createDate" name="createDate" required="true">
						</div>
						<div class="form-group">
							<label>标签</label>
							<input type="text" class="form-control" name="tags" id="tags" placeholder="标签1, 标签2">
						</div>
						<div class="form-group">
							<label>分类</label>
							<select class="selectpicker" multiple name="category[]" id="category"></select>
						</div>
						<div class="form-group">
							<label>权重</label>
							<input type="text" class="form-control" name="priority" id="priority" value='0.5' placeholder="0.5">
						</div>
						<div class="form-group">
							<label>更新频率</label>
							<select class="form-control" id="changefreq" name="changefreq">
								<option value="daily">daily</option>
								<option value="hourly">hourly</option>
								<option value="weekly">weekly</option>
								<option value="monthly">monthly</option>
								<option value="yearly">yearly</option>
								<option value="never">never</option>
								<option value="always">always</option>
							</select>
						</div>
					</div>
					<div class="form-group" style="margin-top:6px">
						<label>正文内容（Markdown）</label>
						<div class="ag-editor-wrap"><div id="content"></div></div>
						<input type="hidden" name="content-markdown-doc" id="content-markdown-doc">
						<input type="hidden" name="content-html-code" id="content-html-code">
					</div>
					<div class="ag-actions">
						<button type="button" id="btn_saveEdit" class="ag-btn ag-btn-primary" onclick="saveEdit()"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>保存修改</button>
						<button type="button" id="btn_delete" class="ag-btn ag-btn-danger" onclick="deleteArticle()"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg>删除文章</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vditor@3.11.3/dist/index.min.js"></script>
<script type="text/javascript">
	// ====== Vditor 公共配置 ======
	var VDITOR_CDN = "https://cdn.jsdelivr.net/npm/vditor@3.11.3";
	function agIsDark(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
	function syncArticleFields(){
		if (window.mdEditor) {
			$('#content-markdown-doc').val(window.mdEditor.getValue());
			$('#content-html-code').val(window.mdEditor.getHTML());
		}
	}
	$(function() {
		//获取文章
		var articleJson = <!--{articleJson}-->;
		//获取分类
		var categoryJson = <!--{categoryJson}-->;

		window.mdEditor = new Vditor("content", {
			height: 640,
			cdn: VDITOR_CDN,
			mode: "sv",
			theme: agIsDark() ? "dark" : "classic",
			preview: { theme: agIsDark() ? "dark" : "default", math: { inlineDigit: true } },
			toolbar: [
				"emoji", "headings", "bold", "italic", "strike", "link", "|",
				"list", "ordered-list", "check", "outdent", "indent", "|",
				"quote", "line", "code", "inline-code", "insert-before", "insert-after", "|",
				"upload", "table", "record", "|", "undo", "redo", "|",
				"fullscreen", "edit-mode", "both", "preview", "outline", "help"
			],
			after: function(){
				// Vditor 的 after 回调中 this 是 options 而非实例，必须用实例变量赋值
				try { if (window.mdEditor) window.mdEditor.setValue(articleJson.contentMD || ""); } catch (e) {}
			}
		});
		//表单赋值
		$('#id').val(articleJson.id);
		$('#title').val(articleJson.title);
		$('#img').val(articleJson.img);
		$('#link').val(articleJson.link);
		$('#createDate').val(articleJson.createDate.replace(" ","T"));
		$('#tags').val(articleJson.tags);
		$('#priority').val( (articleJson.priority=== undefined ? "0.5":articleJson.priority) );
		$('#changefreq').val(articleJson.changefreq === undefined ? "daily":articleJson.changefreq);

		$('#agEditCrumb').text('编辑：' + (articleJson.title || ('#' + articleJson.id)));

		var category = $('#category');
		category.empty();
		for (var i = 0; i < categoryJson.length; i++) {
			category.append('<option id=' + categoryJson[i] + ' value=' + categoryJson[i] + '>' + categoryJson[i] + '</option>');
		}
		category.selectpicker('val',articleJson.category);
		$('.selectpicker').selectpicker('refresh');

		// 主题切换
		$('#agThemeBtn').on('click',function(){
			var dark=document.documentElement.getAttribute('data-theme')==='dark';
			if(dark){document.documentElement.removeAttribute('data-theme');localStorage.setItem('meadow-admin-theme','light');}
			else{document.documentElement.setAttribute('data-theme','dark');localStorage.setItem('meadow-admin-theme','dark');}
			if (window.mdEditor && typeof window.mdEditor.setTheme === 'function') {
				try { window.mdEditor.setTheme(dark ? "classic" : "dark", dark ? "default" : "dark"); } catch(e){}
			}
		});
	});
    //保存按钮(编辑)
    function saveEdit(){
        syncArticleFields();
        $.ajax({
            type: "POST",
            dataType: "json",
			contentType: "application/json; charset=utf-8",
            url: "/admin/saveEdit/",
            data: JSON.stringify($("#editForm").serializeArray()),
            success: function (result) {
                alert(result.msg);
            }
        });
    }
    //删除
    function deleteArticle(){
        if (confirm("确定删除吗?删除后重新发布才能生效")==false){
            return false;
          }
        $.ajax({
            type: "POST",
            dataType: "json",
            contentType: "application/json; charset=utf-8",
            url: "/admin/delete/"+$('#id').val(),
            data: [{"id":$('#id').val()}],
            success: function (result) {
                alert(result.msg);
            }
        });
    }
</script>

</body>
</html>
