    <path d="M70 226 C78 222 82 216 82 210 M70 226 C62 222 58 216 58 210"/>
    <path d="M70 240 C79 236 84 229 84 222 M70 240 C61 236 56 229 56 222"/>
    <path d="M70 254 C79 250 84 243 84 236 M70 254 C61 250 56 243 56 236"/>
  </g>
  <g stroke="#e8c579" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M380 300 C380 270 380 250 380 232"/>
    <path d="M380 240 C387 236 391 231 391 225 M380 240 C373 236 369 231 369 225"/>
    <path d="M380 253 C388 249 392 243 392 237 M380 253 C372 249 368 243 368 237"/>
  </g>
  <!-- 小树 -->
  <g>
    <rect x="292" y="188" width="6" height="26" fill="#8b6f47"/>
    <circle cx="295" cy="178" r="20" fill="#5f7d4f"/>
    <circle cx="283" cy="186" r="13" fill="#6f8f5f"/>
    <circle cx="307" cy="185" r="14" fill="#6f8f5f"/>
