<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe0b4"/>
      <stop offset="1" stop-color="#eef0cf"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dbd76"/>
      <stop offset="1" stop-color="#6f8f5f"/>
    </linearGradient>
  </defs>
  <rect width="440" height="300" fill="url(#sky)"/>
  <!-- 太阳 -->
  <circle cx="355" cy="70" r="34" fill="#f2d492" opacity="0.9"/>
  <circle cx="355" cy="70" r="46" fill="#f2d492" opacity="0.25"/>
  <!-- 云 -->
  <g fill="#ffffff" opacity="0.75">
