    <ellipse cx="120" cy="62" rx="28" ry="12"/>
    <ellipse cx="250" cy="48" rx="30" ry="10"/>
  </g>
  <!-- 远山 -->
  <path d="M0 190 Q90 120 180 180 Q260 130 340 178 Q400 145 440 175 L440 300 L0 300 Z" fill="#8aa96c" opacity="0.75"/>
